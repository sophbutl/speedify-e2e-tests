name: E2E

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "docs/**"

jobs:
  e2e:
    runs-on: [self-hosted, macOS, speedify]
    steps:
      # Check out the repository
      - name: Checkout
        uses: actions/checkout@v4

      # Set up Python 3.12
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Install Python dependencies
      - name: Install dependencies
        run: pip install -r requirements.txt

      # Install Playwright's Chromium browser
      - name: Install Playwright Chromium
        run: playwright install chromium

      # Verify the local app is reachable before running tests
      - name: Check app is running
        run: curl --fail http://localhost:8080

      # Run the fast set (smoke included) on push, or the full suite on manual dispatch, writing JUnit XML and failure artifacts into reports/
      - name: Run tests
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            pytest -m "not slow" --junitxml=reports/junit.xml --screenshot=only-on-failure --video=retain-on-failure --output=reports
          else
            pytest --junitxml=reports/junit.xml --screenshot=only-on-failure --video=retain-on-failure --output=reports
          fi

      # Upload the reports directory regardless of test outcome
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: reports/
