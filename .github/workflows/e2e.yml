name: E2E

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "docs/**"

jobs:
  e2e:
    runs-on: [self-hosted, macOS, speedify]
    steps:
      # Check out the repository
      - name: Checkout
        uses: actions/checkout@v4

      # Verify the pre-installed Python 3.12 toolchain is on PATH
      - name: Verify Python
        run: python3.12 --version

      # Install Python dependencies
      - name: Install dependencies
        run: python3.12 -m pip install -r requirements.txt

      # Install Playwright's Chromium browser
      - name: Install Playwright Chromium
        run: python3.12 -m playwright install chromium

      # Verify the Speedify daemon is reachable before running tests
      - name: Check Speedify daemon is running
        run: /Applications/Speedify.app/Contents/Resources/speedify_cli state

      # Run the fast set (smoke included) on push, or the full suite on manual dispatch, writing JUnit XML and failure artifacts into reports/
      - name: Run tests
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            python3.12 -m pytest -m "not slow" --junitxml=reports/junit.xml --screenshot=only-on-failure --video=retain-on-failure --output=reports
          else
            python3.12 -m pytest --junitxml=reports/junit.xml --screenshot=only-on-failure --video=retain-on-failure --output=reports
          fi

      # Upload the reports directory regardless of test outcome
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: reports/
